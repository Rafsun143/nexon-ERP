<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXORA ERP — Smart Business Management</title>

    <meta
        name="description"
        content="NEXORA ERP — Smart Business Management Dashboard"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #7c3aed;
            --background: #f5f7fb;
            --surface: rgba(255, 255, 255, 0.94);
            --text: #172033;
            --muted: #64748b;
            --border: #e2e8f0;
            --shadow: rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            color: var(--text);

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(99, 102, 241, 0.16),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(124, 58, 237, 0.14),
                    transparent 32%
                ),
                var(--background);

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(650px, 100%);
            padding: 52px 42px;
            text-align: center;

            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;

            box-shadow: 0 25px 70px var(--shadow);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            animation: cardEnter 0.65s ease-out both;
        }

        .logo {
            width: 78px;
            height: 78px;
            margin: 0 auto 22px;

            display: grid;
            place-items: center;

            border-radius: 21px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            color: #fff;
            font-size: 34px;
            font-weight: 800;

            box-shadow:
                0 15px 35px rgba(79, 70, 229, 0.3);

            user-select: none;
        }

        h1 {
            font-size: clamp(32px, 7vw, 48px);
            line-height: 1.1;
            letter-spacing: -1.8px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tagline {
            max-width: 500px;
            margin: 12px auto 30px;

            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .feature {
            padding: 17px 10px;

            border: 1px solid var(--border);
            border-radius: 14px;

            background: rgba(248, 250, 252, 0.8);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        .feature:hover {
            transform: translateY(-3px);

            border-color: rgba(79, 70, 229, 0.25);

            box-shadow:
                0 10px 25px rgba(15, 23, 42, 0.08);
        }

        .feature-icon {
            display: block;
            margin-bottom: 6px;
            font-size: 21px;
            line-height: 1;
        }

        .feature-title {
            display: block;
            font-size: 12px;
            font-weight: 700;
        }

        .loader {
            width: 43px;
            height: 43px;
            margin: 0 auto 15px;

            border: 4px solid #e5e7eb;
            border-top-color: var(--primary);
            border-right-color: var(--secondary);

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        .status {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 23px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 42px;
            padding: 11px 18px;

            border-radius: 10px;
            text-decoration: none;

            font-size: 12px;
            font-weight: 700;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button-primary {
            color: #fff;
            background: var(--primary);

            box-shadow:
                0 8px 20px rgba(79, 70, 229, 0.2);
        }

        .button-primary:hover {
            background: var(--primary-dark);

            box-shadow:
                0 12px 25px rgba(79, 70, 229, 0.25);
        }

        .button-secondary {
            color: var(--text);
            background: #fff;
            border: 1px solid var(--border);
        }

        .button-secondary:hover {
            background: #f8fafc;
        }

        .footer {
            margin-top: 28px;
            color: #94a3b8;
            font-size: 10px;
            line-height: 1.5;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 600px) {
            .page {
                padding: 16px;
            }

            .card {
                padding: 40px 20px;
                border-radius: 21px;
            }

            .logo {
                width: 68px;
                height: 68px;
                margin-bottom: 18px;
                border-radius: 18px;
                font-size: 30px;
            }

            h1 {
                font-size: 34px;
                letter-spacing: -1.2px;
            }

            .tagline {
                margin-bottom: 25px;
                font-size: 13px;
            }

            .features {
                grid-template-columns: 1fr;
                gap: 9px;
                margin-bottom: 25px;
            }

            .feature {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 13px 15px;
                text-align: left;
            }

            .feature-icon {
                margin: 0;
                font-size: 20px;
            }

            .actions {
                flex-direction: column;
                width: 100%;
            }

            .button {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card,
            .loader,
            .feature,
            .button {
                animation: none;
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="card">

            <div class="logo">N</div>

            <h1>NEXORA ERP</h1>

            <p class="tagline">
                Smart Business Management Dashboard
            </p>

            <div class="features">

                <div class="feature">
                    <span class="feature-icon">📊</span>
                    <span class="feature-title">Analytics</span>
                </div>

                <div class="feature">
                    <span class="feature-icon">👥</span>
                    <span class="feature-title">Management</span>
                </div>

                <div class="feature">
                    <span class="feature-icon">📦</span>
                    <span class="feature-title">Inventory</span>
                </div>

            </div>

            <div class="loader"></div>

            <div class="status" id="status">
                Preparing secure sign in...
            </div>

            <div class="actions">

                <a
                    class="button button-primary"
                    href="pages/login.html"
                >
                    Sign In
                </a>

                <a
                    class="button button-secondary"
                    href="pages/signup.html"
                >
                    Create Account
                </a>

            </div>

            <div class="footer">
                NEXORA ERP • Frontend Business Management System
            </div>

        </section>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            setTimeout(function () {
                window.location.href = "pages/login.html";
            }, 700);
        });
    </script>

</body>
</html>
